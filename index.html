<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>HM-Connect Skaner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.6/dist/iife/reader/index.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --bg2: var(--tg-theme-secondary-bg-color, #f2f3f5);
    --tx: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8f98);
    --accent: var(--tg-theme-button-color, #2481cc);
    --accent-tx: var(--tg-theme-button-text-color, #ffffff);
    --ok: #2fa84f;
    --warn: #e0a100;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--tx); font: 15px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { padding: 12px 16px 96px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--hint); font-size: 13px; margin-bottom: 10px; }
  #reader { width: 100%; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; position: relative; }
  #reader video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reader .frame { position: absolute; left: 4%; right: 4%; top: 22%; bottom: 22%; border: 2px solid rgba(255,255,255,.85); border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.28); pointer-events: none; transition: border-color .15s; }
  #reader .frame.hit { border-color: var(--ok); }
  .tools { display: flex; gap: 8px; margin: 10px 0; }
  .tools button { flex: 1; }
  button { border: 0; border-radius: 10px; padding: 11px 12px; font-size: 15px; background: var(--bg2); color: var(--tx); }
  button.pri { background: var(--accent); color: var(--accent-tx); font-weight: 600; }
  #flash { min-height: 22px; font-size: 14px; margin: 4px 0 8px; color: var(--hint); }
  #flash.ok { color: var(--ok); font-weight: 600; }
  #flash.warn { color: var(--warn); }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; }
  li .n { color: var(--hint); width: 22px; text-align: right; font-size: 13px; }
  li .sn { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; flex: 1; word-break: break-all; }
  li .tag { font-size: 11px; color: var(--hint); display: block; font-weight: 400; font-family: inherit; }
  li .x { background: transparent; padding: 4px 8px; color: var(--hint); font-size: 18px; }
  .manual { display: none; gap: 8px; margin-bottom: 10px; }
  .manual.on { display: flex; }
  .manual input { flex: 1; border-radius: 10px; border: 1px solid var(--bg2); background: var(--bg2); color: var(--tx); padding: 10px; font-size: 16px; text-transform: uppercase; }
  .empty { color: var(--hint); font-size: 13px; text-align: center; padding: 10px; }
  #err { display: none; background: #fde8e8; color: #9b1c1c; border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 10px; }
  .fallback { position: fixed; left: 16px; right: 16px; bottom: 16px; display: none; }
  .fallback button { width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
  <div id="err"></div>
  <div id="reader"><video id="video" playsinline muted autoplay></video><div class="frame" id="frame"></div></div>
  <div id="flash"></div>
  <div class="tools">
    <button id="torch" style="display:none"></button>
    <button id="manualBtn"></button>
  </div>
  <div class="manual" id="manual">
    <input id="manualIn" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button class="pri" id="manualAdd">OK</button>
  </div>
  <ul id="list"></ul>
  <div class="empty" id="empty"></div>
</div>
<div class="fallback" id="fallback"><button class="pri" id="sendBtn"></button></div>

<script>
(function () {
  var Q = new URLSearchParams(location.search);
  var MODE = Q.get('m') === 'one' ? 'one' : 'multi';
  var LANG = Q.get('l') === 'ru' ? 'ru' : 'uz';
  var TX = {
    uz: {
      t_multi: '📷 Ketma-ket skanerlash', t_one: '📷 Skanerlash',
      s_multi: "Har bir quti/qurilmadagi SN shtrix-kodi yoki QR kodiga tuting. Material, EAN, MAC va Wi-Fi QR ni ham ushlasa — o'sha qurilmaga biriktiriladi.",
      s_one: 'SN shtrix-kodiga tuting — topilishi bilan botga yuboriladi.',
      torch_on: '🔦 Chiroq', torch_off: '🔦 O\'chirish', manual: '✍️ Qo\'lda', ph: 'SN yozing',
      empty: 'Hali hech narsa skanerlanmadi', send: 'Yuborish', added: '✅ Qo\'shildi: ', dup: '↺ Allaqachon ro\'yxatda: ',
      extra: '➕ Model kodi biriktirildi: ', only_code: 'Bu SN emas (model kodi). Endi SN ni skanerlang.',
      cam_err: "Kamerani ochib bo'lmadi. Telegram'ga kameraga ruxsat bering yoki SN'ni qo'lda yozing.",
      tag_mat: 'material', tag_ean: 'EAN'
    },
    ru: {
      t_multi: '📷 Сканирование подряд', t_one: '📷 Сканирование',
      s_multi: 'Наводите на штрих-код или QR с SN каждой коробки/устройства. Код материала, EAN, MAC и Wi-Fi QR тоже привяжутся к этому устройству.',
      s_one: 'Наведите на штрих-код SN — как только найдётся, отправится в бот.',
      torch_on: '🔦 Фонарь', torch_off: '🔦 Выключить', manual: '✍️ Вручную', ph: 'Введите SN',
      empty: 'Пока ничего не отсканировано', send: 'Отправить', added: '✅ Добавлено: ', dup: '↺ Уже в списке: ',
      extra: '➕ Код модели привязан: ', only_code: 'Это не SN (код модели). Теперь отсканируйте SN.',
      cam_err: 'Не удалось открыть камеру. Разрешите Telegram доступ к камере или введите SN вручную.',
      tag_mat: 'материал', tag_ean: 'EAN'
    }
  }[LANG];

  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  var $ = function (id) { return document.getElementById(id); };
  $('title').textContent = MODE === 'one' ? TX.t_one : TX.t_multi;
  $('sub').textContent = MODE === 'one' ? TX.s_one : TX.s_multi;
  $('manualBtn').textContent = TX.manual;
  $('manualIn').placeholder = TX.ph;
  $('empty').textContent = TX.empty;
  document.documentElement.lang = LANG;

  // ---------- Kodni ajratish (bot ham xuddi shunday tekshiradi) ----------
  var MODEL_RE = /^(I?DS|CS|DH|DHI|IPC|NVR|DVR|PTZ|THC|XVR|HAC|SD)-[A-Z0-9]/;
  function eanOk(d) {   // EAN-13 / UPC-A nazorat raqami
    if (d.length === 12) d = '0' + d;
    if (d.length !== 13) return false;
    var s = 0; for (var i = 0; i < 12; i++) s += (+d.charAt(i)) * (i % 2 ? 3 : 1);
    return (10 - s % 10) % 10 === +d.charAt(12);
  }
  function wifiParse(t) {   // WIFI:T:WPA;S:nom;P:parol;;
    var out = {}, re = /([TSPH]):((?:\\.|[^;])*);/g, m;
    while ((m = re.exec(t.slice(5)))) out[m[1]] = m[2].replace(/\\(.)/g, '$1');
    return out.S ? { k: 'wifi', ssid: out.S, wpass: out.P || '' } : null;
  }
  function classify(raw, fmt) {
    var orig = String(raw || '').trim();
    if (/^WIFI:/i.test(orig)) return wifiParse(orig);
    // Ko'p qatorli QR (EZVIZ/Hikvision qurilma yorlig'i): sayt \r SN \r verification \r model
    if (/[\r\n]/.test(orig)) {
      var parts = orig.split(/[\r\n]+/).map(function (x) { return x.trim().toUpperCase(); }).filter(Boolean);
      var r = { k: 'sn', v: '', ver: '', model: '' };
      parts.forEach(function (x) {
        if (/\./.test(x) && !/\d{6}/.test(x)) return;               // www.ezviz.com
        if (!r.model && MODEL_RE.test(x)) { r.model = x; return; }
        if (!r.ver && /^[A-Z]{6}$/.test(x)) { r.ver = x; return; }
        if (!r.v) { var c = classify(x, 'Code128'); if (c && c.k === 'sn') r.v = c.v; }
      });
      return r.v ? r : null;
    }
    var t = orig.toUpperCase();
    var u = t.replace(/[()\s]/g, '');
    var f = String(fmt || '');
    if (/^([0-9A-F]{2}[:\-]){5}[0-9A-F]{2}$/.test(u) || (/^[0-9A-F]{12}$/.test(u) && /[A-F]/.test(u))) return { k: 'mac', v: u.replace(/[:\-]/g, '') };
    if (/^\d+$/.test(u)) {
      if (/^(EAN|UPC)/.test(f)) return { k: 'ean', v: u };
      if (u.length === 9 && u.charAt(0) === '3') return { k: 'mat', v: u };   // Hikvision material kodi
      if (!f && (u.length === 13 || u.length === 12) && eanOk(u)) return { k: 'ean', v: u };
      if (!f && u.length === 8 && /^(69|46|47|48)/.test(u)) return { k: 'ean', v: u };
      if (u.length >= 6 && u.length <= 16) return { k: 'sn', v: u };         // raqamli SN (ZTE, eski DVR)
      return null;
    }
    if (u.length > 14 && /^I?DS-/.test(u) && /[A-Z]\d{8}$|[A-Z]{2}\d{7}$/.test(u)) return { k: 'sn', v: u.slice(-9) };
    if (MODEL_RE.test(u)) return null;                                          // model nomi — SN emas
    if (/^[A-Z]{1,2}\d{6,8}$/.test(u)) return { k: 'sn', v: u };
    if (/^[0-9A-Z]{15,16}$/.test(u) && /[A-Z]/.test(u) && /\d/.test(u)) return { k: 'sn', v: u };
    if (/^[A-Z0-9][A-Z0-9\-\/]{5,24}$/.test(u) && /[A-Z]/.test(u) && /\d/.test(u)) return { k: 'sn', v: u };
    return null;
  }

  var items = [];        // {sn, mat, ean, mac, ver, model, ssid, wpass, t}
  var pending = {};      // SN'dan oldin ushlangan kodlar
  var seen = {};
  var lastAt = 0;
  var sent = false;

  function haptic(type) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(type); } catch (e) {} }
  function flash(msg, cls) { var f = $('flash'); f.textContent = msg; f.className = cls || ''; }

  function render() {
    var ul = $('list'); ul.innerHTML = '';
    items.forEach(function (it, i) {
      var li = document.createElement('li');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = (i + 1) + '.';
      var s = document.createElement('span'); s.className = 'sn'; s.textContent = it.sn;
      var tags = [];
      if (it.model) tags.push(it.model);
      if (it.ver) tags.push('ver ' + it.ver);
      if (it.mat) tags.push(TX.tag_mat + ' ' + it.mat);
      if (it.ean) tags.push(TX.tag_ean + ' ' + it.ean);
      if (it.mac) tags.push('MAC ' + it.mac);
      if (it.ssid) tags.push('Wi-Fi ' + it.ssid);
      if (tags.length) { var tg2 = document.createElement('span'); tg2.className = 'tag'; tg2.textContent = tags.join(' · '); s.appendChild(tg2); }
      var x = document.createElement('button'); x.className = 'x'; x.textContent = '✕';
      x.onclick = function () { delete seen['sn:' + it.sn]; items.splice(i, 1); render(); };
      li.appendChild(n); li.appendChild(s); li.appendChild(x); ul.appendChild(li);
    });
    $('empty').style.display = items.length ? 'none' : 'block';
    var label = TX.send + ' (' + items.length + ')';
    if (tg && tg.MainButton) {
      tg.MainButton.setText(label);
      if (items.length && MODE === 'multi') tg.MainButton.show(); else tg.MainButton.hide();
    } else {
      $('sendBtn').textContent = label;
      $('fallback').style.display = items.length && MODE === 'multi' ? 'block' : 'none';
    }
  }

  function send() {
    if (sent || !items.length) return;
    sent = true;
    var payload = JSON.stringify({ v: 1, m: MODE, items: items.slice(0, 40).map(function (x) {
      return { sn: x.sn, mat: x.mat || '', ean: x.ean || '', mac: x.mac || '', ver: x.ver || '', model: x.model || '', ssid: x.ssid || '', wpass: x.wpass || '' };
    }) });
    stop();
    if (tg && tg.sendData) tg.sendData(payload); else alert(payload);
  }

  function attach(it, c) {
    if (c.k === 'wifi') { if (it.ssid) return false; it.ssid = c.ssid; it.wpass = c.wpass; return true; }
    if (it[c.k]) return false;
    it[c.k] = c.v; return true;
  }
  function onCode(raw, fmt) {
    var c = classify(raw, fmt);
    if (!c) return;
    var key = c.k + ':' + (c.k === 'wifi' ? c.ssid : c.v);
    var now = Date.now();
    if (c.k === 'sn') {
      if (seen[key]) { if (now - (seen[key]) > 2500) { flash(TX.dup + c.v, 'warn'); seen[key] = now; } return; }
      seen[key] = now;
      var it = { sn: c.v, t: now };
      ['mat', 'ean', 'mac'].forEach(function (k) { if (pending[k]) it[k] = pending[k]; });
      if (pending.ssid) { it.ssid = pending.ssid; it.wpass = pending.wpass; }
      if (c.ver) it.ver = c.ver;
      if (c.model) it.model = c.model;
      pending = {};
      items.push(it); lastAt = now;
      haptic('success'); flash(TX.added + c.v, 'ok'); render();
      return true;
    }
    // Material / EAN / MAC / Wi-Fi — oxirgi SN ga (6 soniya ichida) yoki keyingi SN ga biriktiriladi
    if (seen[key] && now - seen[key] < 4000) return;
    seen[key] = now;
    var last = items[items.length - 1];
    var label = c.k === 'wifi' ? 'Wi-Fi ' + c.ssid : c.v;
    if (last && now - lastAt < 6000 && attach(last, c)) { flash(TX.extra + label, 'ok'); render(); haptic('success'); return true; }
    if (c.k === 'wifi') { pending.ssid = c.ssid; pending.wpass = c.wpass; } else pending[c.k] = c.v;
    flash(TX.only_code, 'warn');
  }

  // ---------- Kamera (ZXing-C++ WebAssembly: bitta kadrdan bir nechta kod) ----------
  var stream = null, track = null, torchOn = false, running = false, busy = false, tick = 0;
  var canvas = document.createElement('canvas'), cctx = canvas.getContext('2d', { willReadFrequently: true });
  var OPTS = { tryHarder: true, maxNumberOfSymbols: 6,
    formats: ['Code128', 'Code39', 'Code93', 'EAN13', 'EAN8', 'UPCA', 'ITF', 'QRCode', 'DataMatrix'] };
  var OPTS2 = Object.assign({}, OPTS, { binarizer: 'GlobalHistogram', tryDenoise: true });
  function stop() { running = false; try { stream && stream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} }
  function hit() { var f = $('frame'); f.classList.add('hit'); setTimeout(function () { f.classList.remove('hit'); }, 350); }
  function loop() {
    if (!running) return;
    var v = $('video');
    if (!busy && v.readyState >= 2 && v.videoWidth) {
      busy = true;
      // Navbat bilan: ramka ichi (mayda shtrix-kodlar uchun aniqroq) va butun kadr (katta QR uchun)
      var mode = tick++ % 3, full = mode > 0;   // 0: ramka ichi, 1: butun kadr, 2: butun kadr (boshqa binarizator — xira/egri QR uchun)
      var vw = v.videoWidth, vh = v.videoHeight;
      var sx = full ? 0 : Math.floor(vw * 0.04), sy = full ? 0 : Math.floor(vh * 0.22);
      var sw = full ? vw : Math.floor(vw * 0.92), sh = full ? vh : Math.floor(vh * 0.56);
      var scale = Math.min(1, 1600 / sw);
      canvas.width = Math.floor(sw * scale); canvas.height = Math.floor(sh * scale);
      cctx.drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
      var img = cctx.getImageData(0, 0, canvas.width, canvas.height);
      ZXingWASM.readBarcodes(img, mode === 2 ? OPTS2 : OPTS).then(function (res) {
        busy = false;
        var got = false;
        // Avval SN, keyin material/EAN — bitta qutidagi kodlar bir-biriga biriktiriladi
        var list = (res || []).filter(function (r) { return r.isValid !== false && r.text; });
        list.sort(function (a, b) { var A = classify(a.text, a.format), B = classify(b.text, b.format); return (A && A.k === 'sn' ? 0 : 1) - (B && B.k === 'sn' ? 0 : 1); });
        list.forEach(function (r) { if (onCode(r.text, r.format)) got = true; });
        if (got) hit();
        if (MODE === 'one' && items.length) setTimeout(send, 250);   // shu kadrdagi model kodlari ham ulgursin
      }).catch(function () { busy = false; });
    }
    setTimeout(loop, 120);
  }
  function start() {
    if (!window.ZXingWASM || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showErr(TX.cam_err); $('manual').classList.add('on'); return; }
    navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } })
      .then(function (s) {
        stream = s; track = s.getVideoTracks()[0];
        var v = $('video'); v.srcObject = s; v.play().catch(function () {});
        try {
          var caps = track.getCapabilities ? track.getCapabilities() : {};
          if (caps.torch) { $('torch').style.display = 'block'; $('torch').textContent = TX.torch_on; }
          if (caps.focusMode && caps.focusMode.indexOf('continuous') >= 0) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function () {});
        } catch (e) {}
        running = true; loop();
      })
      .catch(function () { showErr(TX.cam_err); $('manual').classList.add('on'); });
  }
  function showErr(m) { var e = $('err'); e.textContent = m; e.style.display = 'block'; }

  $('torch').onclick = function () {
    torchOn = !torchOn;
    try { track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) {}
    $('torch').textContent = torchOn ? TX.torch_off : TX.torch_on;
  };
  $('manualBtn').onclick = function () { $('manual').classList.toggle('on'); $('manualIn').focus(); };
  $('manualAdd').onclick = function () {
    var v = $('manualIn').value.trim().toUpperCase();
    if (!v) return;
    var c = classify(v, 'Code128');
    if (c && c.k === 'sn') { onCode(v, 'Code128'); if (MODE === 'one') send(); }
    else if (!seen['sn:' + v]) {   // qo'lda yozilgan noodatiy SN ham qabul qilinadi
      seen['sn:' + v] = Date.now(); items.push({ sn: v, t: Date.now() }); lastAt = Date.now(); render(); if (MODE === 'one') send();
    }
    $('manualIn').value = '';
  };
  $('manualIn').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('manualAdd').click(); });
  $('sendBtn').onclick = send;
  if (tg && tg.MainButton) tg.MainButton.onClick(send);

  window.__hm = { classify: classify, onCode: onCode, items: items };   // sinov uchun
  render();
  start();
})();
</script>
</body>
</html>

<!doctype html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>HM-Connect</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--tx:#1B2430;--mut:#6B7480;--line:#E4E7EB;--pri:#1F3A5F;--pritx:#fff;--acc:#2F6FB2;--chip:#EEF2F7;--sos:#B4423A;--ok:#2E7D5B;--warn:#B7791F}
.dark{--bg:#0E1116;--card:#171B22;--tx:#E7EAEE;--mut:#8C95A1;--line:#252B34;--pri:#8FB3E0;--pritx:#0E1116;--acc:#5B9BE0;--chip:#1E242D;--sos:#C8564D;--ok:#4CAF84;--warn:#E0A84B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overscroll-behavior:none;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hd{background:linear-gradient(160deg,#07090C 0%,#141C28 60%,#1F3A5F 140%);padding:14px 16px 16px;color:#fff}
.hd .top{display:flex;align-items:center;gap:10px}
.hd img{height:44px;mix-blend-mode:screen}
.hd .nm{font-weight:700;font-size:16px;letter-spacing:.3px}.hd .sb{font-size:11.5px;color:#AFC0D6}
.st{display:flex;gap:8px;margin-top:14px}
.st div{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:8px 10px}
.st b{display:block;font-size:18px}.st i{font-style:normal;font-size:10.5px;color:#AFC0D6}
.wrap{padding:0 0 24px}
.card{margin:12px;background:var(--card);border-radius:14px;padding:12px 14px;border:1px solid var(--line)}
.card h4{margin:0 0 4px;font-size:15px}.card p{margin:2px 0;font-size:12.5px;color:var(--mut)}
.sos{margin:0 12px 10px;background:var(--sos);color:#fff;border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px;width:calc(100% - 24px);text-align:left}
.sos .ic{font-size:28px}.sos b{font-size:16px;display:block}.sos small{opacity:.88;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:70px;text-align:left}
.it .ic{font-size:21px}.it b{display:block;font-size:13.5px;margin-top:6px}.it small{color:var(--mut);font-size:11.5px}
.badge{display:inline-block;background:var(--chip);color:var(--acc);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
.ft{text-align:center;color:var(--mut);font-size:12px;margin-top:16px}.ft button{color:var(--acc);padding:4px 8px}
.sec{margin:14px 14px 6px;font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 14px}
.c{background:var(--chip);border:1px solid var(--line);border-radius:18px;padding:7px 12px;font-size:13px}
.c.on{background:var(--pri);color:var(--pritx);border-color:var(--pri);font-weight:600}
.row{display:flex;gap:8px;margin:0 14px}.row .c{flex:1;text-align:center}
select,textarea,input{width:calc(100% - 28px);margin:0 14px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;outline:none}
textarea{min-height:70px;resize:vertical}
.mbtn{display:block;width:calc(100% - 28px);margin:16px 14px 0;background:var(--pri);color:var(--pritx);text-align:center;border-radius:14px;padding:14px;font-weight:700;font-size:15px}
.mbtn.sec2{background:var(--chip);color:var(--tx);border:1px solid var(--line);font-weight:600}
.note{margin:8px 14px;font-size:12px;color:var(--mut)}
.li{margin:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.li .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.li b{font-size:14px}.li p{margin:4px 0 0;font-size:12.5px;color:var(--mut)}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 9px;white-space:nowrap;background:var(--chip)}
.p-yangi{color:var(--acc)}.p-qabul{color:var(--warn)}.p-yolda{color:var(--warn)}.p-bajarildi{color:var(--ok)}.p-late{color:var(--sos)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.acts button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px}
.acts button.p{background:var(--pri);color:var(--pritx);border-color:var(--pri);font-weight:600}
.dev{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.dev:first-child{border-top:0}.dev small{color:var(--mut)}
.ttl{display:flex;align-items:center;gap:10px}.ttl .nm{font-size:17px}
.center{text-align:center;padding:40px 24px;color:var(--mut)}
.big{font-size:44px}
.sk{height:14px;background:var(--line);border-radius:7px;margin:10px 14px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.45}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:86%;text-align:center}
.toast.on{opacity:.95}
.step{display:flex;align-items:center;justify-content:space-between;margin:0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.step span{font-size:13.5px}.step div{display:flex;align-items:center;gap:12px}.step button{width:34px;height:34px;border-radius:10px;background:var(--chip);font-size:18px}.step b{min-width:20px;text-align:center}
.lnk{word-break:break-all;font-size:12.5px;color:var(--acc)}
a{color:var(--acc);text-decoration:none}
.bv{display:flex;flex-direction:column;min-height:100vh}
.bv .hd{padding:10px 16px}.bv .hd img{height:34px}
.cards{flex:1;padding:6px 0 150px}
.mc{margin:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere}
.mc.me{background:var(--chip);margin-left:48px;font-size:13px;color:var(--mut)}
.mc img.ph{max-width:100%;border-radius:10px;display:block;margin-bottom:8px;background:#fff}
.mc pre,.mc code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--chip);border-radius:6px;padding:1px 5px}
.mc pre{padding:8px;white-space:pre-wrap}
.mc .sp{background:var(--mut);color:transparent;border-radius:4px;cursor:pointer}.mc .sp.on{background:none;color:inherit}
.mc .ikb{display:flex;flex-direction:column;gap:6px;margin-top:10px}.mc .ikr{display:flex;gap:6px}
.mc .ikr button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mc .ttl{font-size:11px;color:var(--sos);font-weight:700;margin-top:6px}
.mc.gone{color:var(--mut);font-style:italic}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));z-index:5}
.bar .in{display:flex;gap:6px;align-items:center}
.bar input[type=text]{flex:1;margin:0;width:auto;padding:10px 12px}
.bar .ib{width:40px;height:40px;border-radius:12px;background:var(--chip);font-size:18px;flex:none}
.bar .ib.p{background:var(--pri);color:var(--pritx)}
.rkb{display:none;max-height:42vh;overflow:auto;margin-bottom:8px}.rkb.on{display:block}
.rkb .r{display:flex;gap:6px;margin-bottom:6px}.rkb .r button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px 6px;font-size:13px;font-weight:600}
.busy{margin:10px 12px;color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:#000;z-index:20;display:flex;flex-direction:column}
.ov iframe{flex:1;border:0;width:100%;background:#fff}
.ov .x{background:#111;color:#fff;padding:12px;text-align:center;font-weight:600}
.srch{display:flex;gap:8px;margin:12px}.srch input{flex:1;margin:0;width:auto}.srch button{background:var(--pri);color:var(--pritx);border-radius:12px;padding:0 16px;font-weight:700}
</style></head>

    '<div class="sec">' + T('f_kind') + '</div><div class="chips" id="fk">' + c.kinds.map(function (k) { return '<button class="c" data-k="' + k + '">' + T('k')[k] + '</button>'; }).join('') + '</div>' +
    '<div class="sec">' + T('f_when') + '</div><div class="row" id="fw"><button class="c on" data-w="today">' + T('w_today') + '</button><button class="c" data-w="tom">' + T('w_tom') + '</button><button class="c" data-w="agree">' + T('w_agree') + '</button></div>' +
    '<div class="sec">' + T('f_note') + '</div><textarea id="fn" placeholder="' + esc(T('f_ph')) + '"></textarea>' +
    '<button class="mbtn sec2" id="fl">' + T('f_loc') + '</button>' +
    '<div class="note">' + T('f_media') + '</div><button class="mbtn" id="fs">' + T('send') + '</button></div>');
  $('fk').onclick = function (e) { var b = e.target.closest('[data-k]'); if (!b) return; F.kind = b.dataset.k; [].forEach.call($('fk').children, function (x) { x.classList.toggle('on', x === b); }); hap(); };
  $('fw').onclick = function (e) { var b = e.target.closest('[data-w]'); if (!b) return; F.when = b.dataset.w; [].forEach.call($('fw').children, function (x) { x.classList.toggle('on', x === b); }); hap(); };
  $('fl').onclick = function () { pickLoc(function (lat, lon) { F.lat = lat; F.lon = lon; $('fl').textContent = T('f_loc_ok'); hap(); }); };
  $('fs').onclick = function () {
    if ($('fo')) F.oid = $('fo').value;
    $('fs').disabled = true; $('fs').textContent = '…';
    api('req', { oid: F.oid, kind: F.kind, when: F.when, text: $('fn').value, lat: F.lat, lon: F.lon }).then(function (r) {
      if (!r.ok) { $('fs').disabled = false; $('fs').textContent = T('send'); return toast(T('err')); }
      try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
      render('<div class="center"><div class="big">✅</div><h3>' + T('sent') + '</h3><p>' + esc(T('sent_s', r.id)) + '</p></div><button class="mbtn" onclick="HM.reload()">' + T('home') + '</button><button class="mbtn sec2" onclick="Telegram.WebApp.close()">' + T('to_chat') + '</button>');
    }).catch(function () { $('fs').disabled = false; $('fs').textContent = T('send'); toast(T('err')); });
  };
}
function objs() {
  var c = D.client;
  if (c.objs.length === 1) { stack.pop(); return go(obj, c.objs[0].id); }
  render(header(T('objs'), '') + '<div class="wrap">' + c.objs.map(function (o) {
    return '<button class="li" style="width:calc(100% - 24px);text-align:left" onclick="HM.go(HM.obj,\'' + o.id + '\')"><div class="t"><b>🏢 ' + esc(o.name) + '</b><span class="pill">📹 ' + o.cams + '</span></div><p>' + esc(o.addr || '') + (o.war ? ' · ' + T('war_end', o.war.end) : '') + '</p></button>';
  }).join('') + '</div>');
}
function obj(id) {
  var o = D.client.objs.filter(function (x) { return x.id === id; })[0];
  if (!o) return back();
  var acts = '<div class="acts">' + (o.wifi && D.client.canPass ? '<button onclick="HM.run(\'cwq:' + o.id + '\')">' + T('wifi') + '</button>' : '') + (D.client.canPass ? '<button onclick="HM.run(\'cp:' + o.id + '\')">' + T('pw') + '</button>' : '') +
    '<button onclick="HM.run(\'cwc:' + o.id + '\')">' + T('wcb') + '</button><button class="p" onclick="HM.go(HM.sos,\'' + o.id + '\')">' + T('call') + '</button></div>';
  render(header(o.name, o.addr || '') + '<div class="wrap"><div class="card"><h4>' + (o.war ? T('war_end', o.war.end) : T('war_none')) + '</h4>' + (o.war && o.war.left >= 0 ? '<p>' + T('war', o.war.left) + '</p>' : '') + acts + '</div>' +
    '<div class="sec">' + T('devs') + ' (' + o.devs.length + ')</div><div class="card">' + (o.devs.map(function (d) { return '<div class="dev"><span>' + d.ic + '</span><div><b>' + esc(d.t) + '</b>' + (d.j ? ' · ' + esc(d.j) : '') + '<br><small>' + esc(d.m || '') + '</small></div></div>'; }).join('') || '—') + '</div></div>');
}
function pill(st) { var cl = { yangi: 'p-yangi', qabul: 'p-qabul', "yo'lda": 'p-yolda', bajarildi: 'p-bajarildi' }[st] || ''; return '<span class="pill ' + cl + '">' + esc((T('st') || {})[st] || st) + '</span>'; }
function reqs() {
  var list = D.client.reqs;
  render(header(T('reqs'), '') + '<div class="wrap">' + (list.length ? list.map(function (r) {
    return '<div class="li"><div class="t"><b>' + esc(r.id) + ' · ' + esc(r.obj) + '</b>' + pill(r.st) + '</div><p>' + esc(r.date) + ' — ' + esc(r.text) + '</p>' + (r.rate ? '<p>' + '⭐'.repeat(r.rate) + '</p>' : '') + '</div>';
  }).join('') : '<div class="center">' + T('no_reqs') + '</div>') + '</div>');
}
var C = {};
function calc() {
  C = { out: 2, inn: 2, aud: false, col: false, hi: false };
  function draw() {
    render(header(T('calc'), T('c_note')) + '<div class="wrap"><div class="sec">' + T('c_total') + '</div>' +
      stp('out', T('c_out')) + '<div style="height:8px"></div>' + stp('inn', T('c_in')) +
      '<div class="sec"></div><div class="chips">' + tg2('aud', T('c_aud')) + tg2('col', T('c_col')) + tg2('hi', T('c_hi')) + '</div>' +
      '<button class="mbtn" id="cg">' + T('c_go') + '</button><div class="note">' + T('c_note') + '</div></div>');
    [].forEach.call(document.querySelectorAll('[data-s]'), function (b) { b.onclick = function () { var k = b.dataset.s, d = +b.dataset.d; C[k] = Math.max(0, Math.min(64, C[k] + d)); hap(); draw(); }; });
    [].forEach.call(document.querySelectorAll('[data-t]'), function (b) { b.onclick = function () { C[b.dataset.t] = !C[b.dataset.t]; hap(); draw(); }; });
    $('cg').onclick = function () {
      var n = C.out + C.inn; if (!n) return toast(T('c_total'));
      var parts = [];
      if (C.out) parts.push(C.out + " ta ko'chaga" + (C.col ? ' tunda rangli' : '') + (C.hi ? ' 4K' : ''));
      if (C.inn) parts.push(C.inn + ' ta ichkariga' + (C.aud ? ' ovozli' : '') + (C.col && !C.out ? ' tunda rangli' : '') + (C.hi ? ' 4K' : ''));
      $('cg').disabled = true;
      $('cg').textContent = '⏳';
      api('calc', { text: n + ' ta kamera: ' + parts.join(', ') }).then(function (r) { if (!r.ok) { $('cg').disabled = false; return toast(T('err')); } applyOut(r.out); botView(null); }).catch(function () { $('cg').disabled = false; toast(T('err')); });
    };
  }
  function stp(k, lbl) { return '<div class="step"><span>' + lbl + '</span><div><button data-s="' + k + '" data-d="-1">−</button><b>' + C[k] + '</b><button data-s="' + k + '" data-d="1">+</button></div></div>'; }
  function tg2(k, lbl) { return '<button class="c' + (C[k] ? ' on' : '') + '" data-t="' + k + '">' + lbl + '</button>'; }
  draw();
}
function ref() {
  var link = D.client.ref || '';
  render(header(T('ref_t'), '') + '<div class="wrap"><div class="card"><p>' + T('ref_p') + '</p><p class="lnk">' + esc(link) + '</p><div class="acts"><button class="p" id="rs">' + T('share') + '</button><button id="rc">' + T('copy') + '</button></div></div></div>');
  $('rs').onclick = function () { var u = 'https://t.me/share/url?url=' + encodeURIComponent(link); if (tg) tg.openTelegramLink(u); else open(u); };
  $('rc').onclick = function () { try { navigator.clipboard.writeText(link).then(function () { toast(T('copied')); }); } catch (e) { toast(link); } };
}
function contacts() {
  render(header(T('ct_t'), D.brand) + '<div class="wrap">' + (D.contacts || []).map(function (c) {
    return '<div class="li"><div class="t"><b>👤 ' + esc(c.name) + '</b></div><p><a href="tel:' + esc(c.tel) + '">📞 ' + esc(c.phone) + '</a></p></div>';
  }).join('') + '<button class="mbtn sec2" onclick="Telegram.WebApp.close()">' + T('chat') + '</button></div>');
}
function guest() {
  render(header(D ? D.brand : 'HM-Connect', T('tag')) + '<div class="wrap"><div class="center"><div class="big">👋</div><h3>' + T('g_t') + '</h3><p>' + T('g_p') + '</p></div><button class="mbtn" id="gs">' + T('g_btn') + '</button>' + langFoot() + '</div>');
  $('gs').onclick = function () {
    if (!tg || !tg.requestContact) { if (tg) tg.close(); return; }
    tg.requestContact(function (ok) { if (ok) { render('<div class="center"><div class="big">✅</div><p>' + T('g_wait') + '</p></div>'); setTimeout(load, 4000); } });
  };
}

// ---------------- USTA ----------------
function staffHome() {
  var s = D.staff;
  var tasks = s.tasks.length ? s.tasks.map(function (x) {
    return '<div class="li"><div class="t"><b>📌 ' + esc(x.text) + '</b>' + (x.late ? '<span class="pill p-late">' + T('late') + '</span>' : x.today ? '<span class="pill p-qabul">' + T('today') + '</span>' : '<span class="pill">' + esc(x.due) + '</span>') + '</div>' +
      (x.obj ? '<p>🏢 ' + esc(x.obj) + '</p>' : '') + '<div class="acts"><button onclick="HM.run(\'tk:v:' + x.id + '\')">' + T('open') + '</button>' + (x.loc ? '<button onclick="HM.run(\'tk:loc:' + x.id + '\')">📍</button>' : '') + '<button class="p" onclick="HM.run(\'tk:done:' + x.id + '\')">' + T('done') + '</button></div></div>';
  }).join('') : '<div class="note">' + T('no_tasks') + '</div>';
  var reqs = s.reqs.length ? s.reqs.map(function (r) {
    var a = r.st === 'yangi' ? '<button class="p" onclick="HM.run(\'rqa:' + r.id + '\')">' + T('accept') + '</button>' :
      r.st === 'qabul' ? '<button onclick="HM.run(\'rqw:' + r.id + '\')">' + T('onway') + '</button><button class="p" onclick="HM.run(\'rqd:' + r.id + '\')">' + T('done') + '</button>' :
      r.st === "yo'lda" ? '<button class="p" onclick="HM.run(\'rqd:' + r.id + '\')">' + T('done') + '</button>' : '';
    return '<div class="li"><div class="t"><b>' + esc(r.id) + ' · ' + esc(r.obj) + '</b>' + pill(r.st) + '</div><p>👤 ' + esc(r.client) + ' · ' + esc(r.date) + '</p><p>' + esc(r.text) + '</p><div class="acts">' + a +
      '<button onclick="HM.run(\'rqm:' + r.id + '\')">' + T('write') + '</button>' + (r.media ? '<button onclick="HM.run(\'rqv:' + r.id + '\')">' + T('media') + '</button>' : '') + '</div></div>';
  }).join('') : '<div class="note">' + T('no_oreqs') + '</div>';
  render(header(D.brand, D.name) + '<div class="wrap">' +
    '<div class="srch"><input type="text" id="sq" placeholder="' + esc(T('srch')) + '"><button id="sg">' + T('go') + '</button></div>' +
    '<div class="grid">' + tile('☰', T('all'), T('all_s'), "HM.bot('/menu')") + tile('➕', T('newobj'), '', "HM.bot(" + JSON.stringify(D.staff.newObjBtn || '') .replace(/"/g, "'") + ")") + '</div><div style="height:10px"></div>' +
    '<div class="grid">' + tile('🗺', nt(T('route')), '', "HM.run('tk:route')") + tile('📄', nt(T('smeta')), '', "HM.run('sm:new')") + '</div><div style="height:10px"></div>' +
    '<div class="grid">' + tile('✍️', T('sg_tile'), '', "HM.go(HM.sig,{what:'me'})") + '</div>' +
    '<div class="sec">' + T('oreqs') + ' (' + s.reqs.length + ')</div>' + reqs +
    '<div class="sec">' + T('tasks') + ' (' + s.tasks.length + ')</div>' + tasks +
    (s.isSuper ? '<div class="grid" style="margin-top:12px">' + tile('📣', nt(T('invite')), '', "HM.run('iv:n')") + tile('👑', T('panel'), '', "HM.bot(" + JSON.stringify(D.staff.panelBtn || '').replace(/"/g, "'") + ")") + '</div>' : '') + langFoot() + '</div>');
  $('sg').onclick = function () { var v = $('sq').value.trim(); if (v) botView({ t: 'text', text: v }); };
  $('sq').onkeydown = function (e) { if (e.key === 'Enter') $('sg').click(); };
}

// ---------------- ✍️ IMZO (usta — bir marta; mijoz — akt uchun, ixtiyoriy) ----------------
function sigPad(o) {
  var me = o.what === 'me';
  render(header(T('sg_t'), me ? D.name : o.what) + '<div class="wrap"><div class="note">' + (me ? T('sg_me') : T('sg_cl')) + '</div>' +
    '<canvas id="sgc" style="width:100%;height:240px;overscroll-behavior:contain;background:#fff;border-radius:12px;touch-action:none;display:block;margin:10px 0"></canvas>' +
    '<div class="note" style="text-align:center">' + T('sg_hint') + '</div><div class="acts"><button id="sgx">' + T('sg_clear') + '</button><button class="p" id="sgs">' + T('sg_save') + '</button></div></div>');
  var c = $('sgc'), r = c.getBoundingClientRect(), k = window.devicePixelRatio || 1;
  c.width = r.width * k; c.height = r.height * k;
  var x = c.getContext('2d'), drawn = false, down = false;
  function clear() { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.strokeStyle = '#10213a'; x.lineWidth = 2.6 * k; x.lineCap = 'round'; x.lineJoin = 'round'; drawn = false; }
  function pt(e) { var b = c.getBoundingClientRect(); return [(e.clientX - b.left) * k, (e.clientY - b.top) * k]; }
  clear();
  c.onpointerdown = function (e) { down = true; var p = pt(e); x.beginPath(); x.moveTo(p[0], p[1]); c.setPointerCapture(e.pointerId); };
  c.onpointermove = function (e) { if (!down) return; var p = pt(e); x.lineTo(p[0], p[1]); x.stroke(); drawn = true; };
  c.onpointerup = c.onpointercancel = function () { down = false; };
  // iOS: barmoq harakati sahifani surmasin — faqat chiziq chizilsin
  ['touchstart', 'touchmove'].forEach(function (ev) { c.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  noSwipe(true);
  $('sgx').onclick = clear;
  $('sgs').onclick = function () {
    if (!drawn) { hap('heavy'); return toast(T('sg_empty')); }
    var png = c.toDataURL('image/png'), b = $('sgs'); b.disabled = true; b.textContent = '⏳';
    var d = me ? 'sg:p' : 'aks:' + o.what + ':' + (o.al || L), out = [];
    api('m', { t: 'cb', d: d }).then(function (r1) { out = out.concat(r1.out || []); return api('m', { t: 'file', b64: png, name: 'imzo.png' }); })
      .then(function (r2) { out = out.concat(r2.out || []); if (!r2.ok && !(r2.out && r2.out.length)) { b.disabled = false; b.textContent = T('sg_save'); return toast(T('err')); } applyOut(out); stack.pop(); botView(null); })
      .catch(function () { b.disabled = false; b.textContent = T('sg_save'); toast(T('err')); });
  };
}

// ---------------- Yuklash ----------------
function load() {
  if (!API) { render('<div class="center">' + T('err_cfg') + '</div>'); return; }
  if (!D) render(header('HM-Connect', T('tag')) + '<div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:85%"></div>');
  api('home').then(function (r) {
    if (!r.ok) { render('<div class="center"><div class="big">⚠️</div>' + (r.err === 'auth' ? T('err_auth') : T('err')) + '</div>'); return; }
    D = r; L = r.lang || L; stack = []; home();
    if (Q.get('sig') && D.role === 'staff') { go(sigPad, { what: Q.get('sig'), al: Q.get('al') || L }); }
  }).catch(function () { render('<div class="center"><div class="big">⚠️</div>' + T('err') + '<br><br><button class="mbtn" onclick="HM.reload()">↻</button></div>'); });
}
HM.sig = sigPad; HM.sos = sos; HM.objs = objs; HM.obj = obj; HM.reqs = reqs; HM.calc = calc; HM.ref = ref; HM.contacts = contacts; HM.reload = function () { D = null; load(); };
HM.lang = function () { L = L === 'uz' ? 'ru' : 'uz'; api('lang', { l: L }); stack = []; home(); };
if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', theme); tg.BackButton.onClick(back); }
// Pastga surish bilan ilova yopilib/qimirlab ketmasin (imzo, skaner, ro'yxatlar). Telegram 7.7+; eskida jim o'tadi.
function noSwipe(on) { try { if (!tg) return; if (on) { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } else if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {} }
noSwipe(true);
theme(); load();
})();
</script>
